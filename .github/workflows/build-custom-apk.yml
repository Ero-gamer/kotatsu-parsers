name: Fixed Build Kotatsu APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App
        uses: actions/checkout@v4
        with:
          repository: Kotatsu-Redo/Kotatsu-Redo
          path: main-app
          fetch-depth: 1 # Faster download

      - name: Checkout Your Library
        uses: actions/checkout@v4
        with:
          path: my-library-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix Environment & Swap Library
        run: |
          # 1. Create a dummy local.properties to prevent "SDK not found" errors
          touch main-app/local.properties
          
          # 2. Delete the old lib and move yours in
          rm -rf main-app/kotatsu-parsers
          cp -r my-library-source/. main-app/kotatsu-parsers/
          
          # 3. Force the app to use your local library module
          # We use a robust 'sed' to ensure the build.gradle is updated correctly
          sed -i "s/implementation.*kotatsu-parsers.*/implementation project(':kotatsu-parsers')/" main-app/app/build.gradle

      - name: Build with Gradle Wrapper
        run: |
          cd main-app
          chmod +x gradlew
          # We use --stacktrace to see exactly what's wrong if it fails again
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-Fixed-Build
          path: main-app/app/build/outputs/apk/release/*.apk
