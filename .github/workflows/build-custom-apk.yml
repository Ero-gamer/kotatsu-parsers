name: Build Custom Kotatsu APK

on:
  workflow_dispatch: # Manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Get the Main App Code
      - name: Checkout App Repo
        uses: actions/checkout@v4
        with:
          repository: Kotatsu-Redo/Kotatsu-Redo
          path: main-app

      # 2. Get YOUR Library Code (the fork you are in)
      - name: Checkout Your Library Fork
        uses: actions/checkout@v4
        with:
          path: my-library-source

      # 3. Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 4. Swap the App's library with Your Library
      - name: Replace Library Source
        run: |
          # Remove the existing library folder in the app repo
          rm -rf main-app/kotatsu-parsers
          
          # Move your forked code into that exact spot
          cp -r my-library-source/. main-app/kotatsu-parsers/
          
          # Ensure the app's settings.gradle recognizes the module
          # (Usually Kotatsu already has this, but this ensures it's correct)
          cd main-app
          sed -i "s/implementation.*kotatsu-parsers.*/implementation project(':kotatsu-parsers')/" app/build.gradle

      # 5. Build the Release APK
      - name: Build Release APK
        run: |
          cd main-app
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      # 6. Upload the finished APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-Redo-Custom
          path: main-app/app/build/outputs/apk/release/*.apk
