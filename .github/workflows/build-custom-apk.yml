name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App (Kotatsu-Redo)
        uses: actions/checkout@v4
        with:
          repository: Kotatsu-Redo/Kotatsu-Redo
          path: main-app
          ref: devel

      - name: Checkout Your Parser (Ero-gamer)
        uses: actions/checkout@v4
        with:
          path: my-parsers

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Patch & Sync Parsers
        run: |
          # 1. Clear old lib and move yours in
          rm -rf main-app/kotatsu-parsers
          cp -r my-parsers/. main-app/kotatsu-parsers/
          
          # 2. Fix JSON conflict from your build.gradle.kts
          sed -i '/libs.json/d' main-app/kotatsu-parsers/build.gradle.kts
          
          # 3. Create dummy local.properties
          echo "sdk.dir=$ANDROID_HOME" > main-app/local.properties

      - name: Build APK
        working-directory: main-app
        run: |
          chmod +x gradlew
          # Building Debug first as it's most compatible for testing
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-Custom-App
          # Using wildcard ** to find the APK no matter where Gradle put it
          path: main-app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error # This will make the job FAIL if no APK is found
