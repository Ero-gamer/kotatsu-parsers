name: Fixed Build Kotatsu-Redo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App (Kotatsu-Redo)
        uses: actions/checkout@v4
        with:
          repository: Kotatsu-Redo/Kotatsu-Redo
          path: main-app
          ref: devel # Most Redo forks use 'devel' as the active branch

      - name: Checkout Your Parser (Ero-gamer)
        uses: actions/checkout@v4
        with:
          repository: Ero-gamer/kotatsu-parsers
          path: my-parsers

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Patch & Sync Parsers
        run: |
          # 1. Kotatsu-Redo usually expects the parser to be inside its own directory
          # We delete the old ones to prevent "Duplicate Class" errors
          rm -rf main-app/kotatsu-parsers
          rm -rf main-app/kotatsu-parsers-ksp
          
          # 2. Copy your source code in
          cp -r my-parsers/. main-app/kotatsu-parsers/
          
          # 3. FIX: Remove the problematic JSON dependency that causes Exit Code 1 in APK builds
          sed -i '/libs.json/d' main-app/kotatsu-parsers/build.gradle.kts
          
          # 4. Create dummy local.properties
          echo "sdk.dir=$ANDROID_HOME" > main-app/local.properties

      - name: Build APK
        working-directory: main-app
        run: |
          chmod +x gradlew
          # We use assembleDebug first because it's faster and less strict for testing
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
