name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App (Kotatsu-Redo)
        uses: actions/checkout@v4
        with:
          repository: Kotatsu-Redo/Kotatsu-Redo
          path: main-app
          ref: devel

      - name: Checkout Your Parser (Ero-gamer)
        uses: actions/checkout@v4
        with:
          path: my-parsers

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Workspace & Sync Library
        run: |
          # 1. Clear existing parsers in the app repo
          rm -rf main-app/kotatsu-parsers
          
          # 2. Inject your forked source
          cp -r my-parsers/. main-app/kotatsu-parsers/
          
          # 3. Strip problematic dependencies from your Kotlin script
          # This prevents "Duplicate Class" errors during dexing
          sed -i '/libs.json/d' main-app/kotatsu-parsers/build.gradle.kts
          sed -i '/libs.okhttp/d' main-app/kotatsu-parsers/build.gradle.kts
          
          # 4. Create dummy local.properties for the Android SDK
          echo "sdk.dir=$ANDROID_HOME" > main-app/local.properties

      - name: Build Unsigned Release APK
        working-directory: main-app
        run: |
          chmod +x gradlew
          # We use assembleRelease but tell Gradle NOT to fail if signing is missing
          ./gradlew :app:assembleRelease -Pandroid.injected.signing.config.file=none --no-daemon

      - name: Upload Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotatsu-Unsigned-Release
          path: main-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
